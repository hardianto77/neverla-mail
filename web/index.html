<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neverla Mail — Disposable Temp Mail Engine</title>
    <script>
      (function() {
        var _orig = document.title;
        Object.defineProperty(document, 'title', {
          get: function() { return _orig.replace(/🐴/g, '').trim(); },
          set: function(v) { _orig = v.replace(/🐴/g, '').trim(); }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
