<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2749"/>
      <stop offset="100%" stop-color="#061222"/>
    </linearGradient>
    <linearGradient id="logo-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- 36x36 Squircle Badge -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#logo-bg)" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="1.2" y="1.2" width="33.6" height="33.6" rx="7.8" fill="none" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.4"/>
    
    <!-- Monogram N scaled to 36px -->
    <!-- Left Pillar -->
    <rect x="9.5" y="10" width="4.7" height="16" rx="0.8" fill="#FFFFFF"/>
    <!-- Right Pillar -->
    <rect x="21.8" y="10" width="4.7" height="16" rx="0.8" fill="#FFFFFF"/>
    <!-- Diagonal -->
    <polygon points="9.5,10 14.2,10 26.5,26 21.8,26" fill="url(#logo-diag)"/>
  </g>

  <!-- Typography with exact kerning -->
  <!-- "neverla" in bold Biru Dongker -->
  <text x="49" y="29" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Sans', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="750" fill="#0C2340" letter-spacing="-0.4px">neverla</text>
  
  <!-- "mail" in Royal Blue with proper offset -->
  <text x="130" y="29" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Sans', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#2563EB" letter-spacing="-0.3px">mail</text>
</svg>