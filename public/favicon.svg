<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GrabMail">
  <!--
    The favicon, drawn for the two places it is actually judged: a browser tab,
    and a Google result on a phone.

    SQUARE, EDGE TO EDGE, NO ROUNDED CORNERS. Google masks favicons into a
    circle in mobile search results, so rounding the corners only puts white
    slivers in the four places about to be discarded — while leaving them
    visible in a tab, where nothing is cropped. Full bleed gives a clean disc
    there and a clean square here.

    THE FLAP RUNS CORNER TO CORNER. That is the whole difference between a
    shape that reads as an envelope and a shape that reads as a tick next to a
    box. An earlier version had the chevron floating in the middle with a
    tear-off slot beside it; at sixteen pixels it read as "V |" and not as mail
    at all. The slot went with it — at this size the job is to be recognised in
    a fifth of a second, not to explain what disposable means.

    SAFE INSIDE THE CIRCLE: the envelope's furthest corner is 24 units from the
    centre against a radius of 32, so the mask never touches it.
  -->
  <rect width="64" height="64" fill="#1d4ed8"/>
  <rect x="12" y="19" width="40" height="26" rx="3" fill="#fff"/>
  <path d="M14.8 21.8 32 34.2 49.2 21.8" fill="none" stroke="#1d4ed8" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
